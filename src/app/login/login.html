<div class="login-wrapper">
  <div class="login-box">
    <h2>Welcome Back</h2>
    <p class="subtitle">Sign in to continue</p>

    <input
      [(ngModel)]="username"
      placeholder="Username"
      autocomplete="off"
    />

    <button (click)="login()">Login</button>

    <p class="error" *ngIf="error">{{ error }}</p>

    <p class="hint">
      Tip: use <b>admin</b> to login as <b>ADMIN</b>
    </p>
  </div>
</div>
